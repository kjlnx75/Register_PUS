<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REGISTER PUS</title>

  <!-- 1. Favicon untuk Tab Browser -->
  <link rel="icon" type="image/png" href="https://i.ibb.co.com/xt0D67Y2/Logo3.png">

  <!-- 2. Pengaturan khusus Android / PWA -->
  <meta name="theme-color" content="#3182ce">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="application-name" content="R/I/PUS">

  <!-- 3. Ikon khusus iOS (Apple Safari) -->
  <link rel="apple-touch-icon" href="https://i.ibb.co.com/xt0D67Y2/Logo3.png">

  <!-- 4. Web App Manifest (Sudah Diperbaiki) -->
  <link rel="manifest" href='data:application/manifest+json,{
    "name": "REGISTER PUS",
    "short_name": "R/I/PUS",
    "start_url": "./",
    "display": "standalone",
    "background_color": "#ffffff",
    "theme_color": "#3182ce",
    "icons": [
      {
        "src": "https://i.ibb.co.com/xt0D67Y2/Logo3.png",
        "sizes": "192x192",
        "type": "image/png",
        "purpose": "any"
      },
      {
        "src": "https://i.ibb.co.com/QFp6rq8R/Logo2.png",
        "sizes": "512x512",
        "type": "image/png",
        "purpose": "any"
      }
    ]
  }'>

  <!-- Font Awesome untuk Ikon Loading -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    .loading-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #4a5568;
      z-index: 1;
    }

    .loading-icon {
      font-size: 3rem;
      color: #3182ce;
      margin-bottom: 12px;
    }

    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 2;
    }
  </style>
</head>
<body>

  <div class="loading-container">
    <i class="fa-solid fa-spinner fa-spin loading-icon"></i>
    <p>Memuat aplikasi...</p>
  </div>

  <iframe 
    src="https://script.google.com/macros/s/AKfycbxlZGJAw32o5uQy9BTYZknc9_zaIbUf_bsYnss9u_S8E0cTPa003IHOfXZbSvpUTK_-Og/exec" 
    allow="geolocation; microphone; camera">
  </iframe>

</body>
</html>
