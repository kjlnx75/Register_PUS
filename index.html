<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register PUS</title>
  <style>
    /* Reset CSS dasar */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden; /* Mencegah double scrollbar */
      font-family: Arial, sans-serif;
      background-color: #f4f6f9;
    }

    /* Tampilan saat aplikasi sedang dimuat */
    .loading-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #555;
      z-index: 1;
    }

    .spinner {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 10px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Container iFrame agar responsif penuh */
    iframe {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 2; /* Menutupi loading setelah dimuat */
    }
  </style>
</head>
<body>

  <!-- Spinner Loading -->
  <div class="loading-container">
    <div class="spinner"></div>
    <p>Memuat aplikasi...</p>
  </div>

  <!-- iFrame Google Apps Script -->
  <iframe 
    src="https://script.google.com/macros/s/AKfycbxlZGJAw32o5uQy9BTYZknc9_zaIbUf_bsYnss9u_S8E0cTPa003IHOfXZbSvpUTK_-Og/exec" 
    allow="geolocation; microphone; camera">
  </iframe>

</body>
</html>
