<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register PUS</title>
    
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1qeuhe1qzmK57wYFa763P4hdyDRA2BMHd">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            padding: 40px 30px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        .app-icon {
            width: 72px;
            height: 72px;
            margin-bottom: 20px;
            object-fit: contain;
        }

        .app-title {
            color: #202124;
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .app-description {
            color: #5f6368;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .btn-link {
            display: inline-block;
            background-color: #34A853; /* Warna Hijau Khas Google Apps Script */
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            transition: background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 4px 10px rgba(52, 168, 83, 0.25);
        }

        .btn-link:hover {
            background-color: #2d9248;
            box-shadow: 0 6px 14px rgba(52, 168, 83, 0.35);
        }

        .redirect-notice {
            margin-top: 20px;
            font-size: 12px;
            color: #80868b;
        }
    </style>

</head>
<body>

    <div class="card">
        <img src="https://lh3.googleusercontent.com/d/1qeuhe1qzmK57wYFa763P4hdyDRA2BMHd" alt="Google Apps Script Icon" class="app-icon">
        
        <h1 class="app-title">Register PUS</h1>
        
        <a href="https://script.google.com/macros/s/AKfycbxlZGJAw32o5uQy9BTYZknc9_zaIbUf_bsYnss9u_S8E0cTPa003IHOfXZbSvpUTK_-Og/exec" class="btn-link" target="_blank">
            Buka Aplikasi &rarr;
        </a>
    </div>

    <script>
        const appsScriptUrl = "https://script.google.com/macros/s/AKfycbxlZGJAw32o5uQy9BTYZknc9_zaIbUf_bsYnss9u_S8E0cTPa003IHOfXZbSvpUTK_-Og/exec";

        setTimeout(() => {
            if (appsScriptUrl !== "https://script.google.com/macros/s/AKfycbxlZGJAw32o5uQy9BTYZknc9_zaIbUf_bsYnss9u_S8E0cTPa003IHOfXZbSvpUTK_-Og/exec") {
                window.location.href = appsScriptUrl;
            }
        }, 3000);
    </script>
</body>
</html>
